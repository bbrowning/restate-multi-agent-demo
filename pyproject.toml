[project]
name = "reviewdemo"
version = "0.1.0"
description = "Durable multi-agent code review orchestration on Restate, driving real agent TUIs in tmux"
requires-python = ">=3.11"
dependencies = [
    "restate-sdk>=1.0",
    "hypercorn>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewdemo"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
